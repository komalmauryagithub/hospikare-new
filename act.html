<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="/assets/logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Activities - HospiKare</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="/css/theme-system.css?v=1790677498">
    <link rel="stylesheet" href="/css/base.css?v=1790677498">
    <link rel="stylesheet" href="/css/layout.css?v=1790677498">
    <link rel="stylesheet" href="/css/components.css?v=1790677498">
    <link rel="stylesheet" href="/css/users.css?v=1790677498">
    <link rel="stylesheet" href="/css/mobile-ui.css?v=1790677498">
    
    <style>
        body {
            background-color: var(--hk-off-white, #f8fafc);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            padding-top: 80px; /* Space for fixed navbar */
        }

        /* Activity Navbar */
        .act-navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            background: white !important;
            box-sizing: border-box;
            border-bottom: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            height: 80px;
        }
        .act-logo-section { display: flex; align-items: center; }
        .act-logo-img { height: 55px; width: auto; object-fit: contain; transform: scale(2.2); transform-origin: left center; }
        .act-nav-right { display: flex; align-items: center; gap: 24px; }
        .act-home-link {
            color: #475569; font-weight: 600; text-decoration: none; font-size: 15px; transition: color 0.2s;
        }
        .act-home-link:hover { color: #2563eb; }
        .act-dashboard-btn {
            background: #2563eb; color: white; padding: 10px 20px; border-radius: 8px; font-weight: 600; text-decoration: none; font-size: 14px; box-shadow: 0 2px 4px rgba(37,99,235,0.2); transition: background 0.2s;
        }
        .act-dashboard-btn:hover { background: #1d4ed8; }

        @media (max-width: 640px) {
            .act-navbar { padding: 0 16px; height: 70px; }
            body { padding-top: 70px; }
            .act-logo-img { width: 140px; height: auto; transform: scale(1.2); transform-origin: left center; }
            .act-nav-right { gap: 12px; }
            .act-home-text { display: none; }
            .act-dashboard-btn { padding: 8px 12px; font-size: 13px; }
            .act-home-link i { font-size: 18px; }
        }

        /* Nav Tabs */
        .page-header-section {
            background: white;
            border-bottom: 1px solid #e2e8f0;
            padding: 24px 0 0 0;
            margin-bottom: 32px;
        }
        .page-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }
        .page-title {
            font-size: 28px;
            font-weight: 800;
            color: #0f172a;
            margin: 0 0 20px 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .tabs-container {
            display: flex;
            gap: 32px;
        }
        .navItem {
            padding: 12px 0;
            color: #64748b;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }
        .navItem:hover {
            color: #2563eb;
        }
        .navItem.activeNav {
            color: #2563eb;
            border-bottom-color: #2563eb;
        }

        /* PROFESSIONAL TABLE STYLES */
        .activityBox {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            border: 1px solid #e2e8f0;
            padding: 32px;
            margin-bottom: 40px;
        }
        .activityTable {
            width: 100% !important;
            border-collapse: separate !important;
            border-spacing: 0 !important;
            background: white !important;
        }
        .activityTable thead th {
            background: #f8fafc !important;
            color: #475569 !important;
            padding: 16px 24px !important;
            text-align: left !important;
            font-size: 13px !important;
            font-weight: 700 !important;
            text-transform: uppercase !important;
            letter-spacing: 0.05em !important;
            border-bottom: 1px solid #e2e8f0 !important;
            border-top: 1px solid #e2e8f0 !important;
        }
        .activityTable thead th:first-child { border-top-left-radius: 8px; border-left: 1px solid #e2e8f0; }
        .activityTable thead th:last-child { border-top-right-radius: 8px; border-right: 1px solid #e2e8f0; }
        
        .activityTable tbody td {
            padding: 20px 24px !important;
            border-bottom: 1px solid #f1f5f9 !important;
            color: #475569 !important;
            font-size: 14px !important;
            font-weight: 500 !important;
            vertical-align: middle !important;
        }
        .activityTable tbody tr:last-child td { border-bottom: none !important; }
        .activityTable tbody tr:hover td {
            background: #f8fafc !important;
        }
        .invoice-btn {
            background: white;
            color: #2563eb;
            border: 1px solid #bfdbfe;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }
        .invoice-btn:hover {
            background: #eff6ff;
            border-color: #93c5fd;
        }
    </style>
    <script src="/js/invoice-template.js?v=1790677498"></script>
</head>
<body>
        <nav class="navbar" id="navbar">
        <div class="logoSection">
            <img src="/assets/logo.png" alt="HospiKare Logo" class="logo-img">
        </div>
        <div class="nav-links">
            <a href="users.html#heroSection">Home</a>
            <a href="users.html#featuredHospitalSection">Hospitals</a>
            <a href="users.html#ambulanceSection">Ambulance</a>
            <a href="users.html#medicineSection">Pharmacy</a>
            <a href="users.html#insuranceSection">Insurance</a>
            <a href="users.html#labsSection">Lab Reports</a>
            <a href="users.html#equipmentSection">Medical Equipments</a>
            <a href="act.html">My Orders</a>
        </div>
        <div class="navRight flex items-center gap-4">
            
            <button class="btn btn-primary btn-sm" id="authOpenBtn" type="button">Login / Portal</button>
            <button class="btn btn-outline-blue btn-sm userLogoutBtn" id="logoutBtn" type="button" hidden>Logout</button>
            <button class="menuBtn" id="menuBtn">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>
    </nav>

    <div class="page-header-section">
        <div class="page-container">
            <h1 class="page-title">My Account</h1>
            <div class="tabs-container" id="centerNavbar">
                <div class="navItem activeNav">
                    <i class="fa-solid fa-box"></i>
                    <span>Orders</span>
                </div>
                <div class="navItem">
                    <i class="fa-solid fa-clock-rotate-left"></i>
                    <span>History</span>
                </div>
                <div class="navItem">
                    <i class="fa-solid fa-credit-card"></i>
                    <span>Payment</span>
                </div>
            </div>
        </div>
    </div>

    <div class="page-container">
        <div id="mainContainer">
            <!-- Content loaded by JS -->
        </div>
    </div>

    <script src="/js/act.js?v=1790743000"></script>
    <!-- Floating Emergency Button -->
    <a href="tel:108" class="floating-emergency">
        <i class="fa-solid fa-phone"></i>
        <span>108</span>
    </a>

    <!-- Profile Modal -->
    <div class="modal" id="userProfileModal">
        <div class="modal-content" style="position: relative; max-width: 350px; text-align: center; border-radius: 24px; padding: 40px 24px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);">
            <span class="close-modal" id="closeProfileModal" style="position: absolute; top: 16px; right: 20px; font-size: 24px; cursor: pointer; border: none; background: transparent; padding: 0;">&times;</span>
            <div id="profileModalPicContainer" style="margin: 0 auto 20px auto; width: 120px; height: 120px; border-radius: 50%; padding: 4px; background: linear-gradient(135deg, #3b82f6, #8b5cf6);">
                <img id="profileModalImg" src="" alt="Profile" style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%; border: 4px solid white;">
            </div>
            <h2 id="profileModalName" style="margin: 0 0 4px 0; font-size: 22px; font-weight: 800; color: #0f172a;">User Name</h2>
            <p id="profileModalEmail" style="margin: 0 0 24px 0; font-size: 14px; color: #64748b; font-weight: 500;">user@example.com</p>
            <div style="display: flex; gap: 12px; flex-direction: column;">
                <button class="btn btn-primary" onclick="window.location.href='act.html'" style="width: 100%; border-radius: 12px; height: 44px; font-weight: 700; background: #f8fafc; color: #0f172a; border: 1px solid #e2e8f0; box-shadow: none; cursor:pointer;">My Orders / Activity</button>
                <button class="btn btn-primary" id="modalLogoutBtn" style="width: 100%; border-radius: 12px; height: 44px; font-weight: 700; background: #fee2e2; color: #dc2626; border: none; box-shadow: none; cursor:pointer;">Logout</button>
            </div>
        </div>
    </div>

</body>
</html>
