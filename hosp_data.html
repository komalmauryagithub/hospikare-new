<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="/assets/logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Details - HospiKare</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/theme-system.css?v=1790737600">
    <link rel="stylesheet" href="/css/base.css?v=1790737600">
    <link rel="stylesheet" href="/css/layout.css?v=1790737600">
    <link rel="stylesheet" href="/css/components.css?v=1790737600">
    <link rel="stylesheet" href="/css/users.css?v=1790737600">
    <link rel="stylesheet" href="/css/hosp_data.css?v=1790737600">
    <link rel="stylesheet" href="/css/mobile-ui.css?v=1790737600">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>

    <div class="hospitalDetailsContainer"
        id="hospitalDetailsContainer">
    </div>

    <!-- EXACT SAME ACCOUNT ACCESS MODAL AS USERS.HTML -->
    <div class="modal" id="authOverlay">
        <div class="modal-content" style="max-width: 500px;">
            <div class="modal-header">
                <h2>Account Access</h2>
                <button class="close-modal" id="closeAuthModal" type="button" onclick="closeAuthModal()">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="authTabs flex gap-4" style="margin-bottom: var(--space-6); border-bottom: 1px solid var(--hk-grey-200);">
                    <button type="button" class="authTab activeTab" id="loginTab" onclick="switchAuthTab('login')">Login</button>
                    <button type="button" class="authTab" id="registerTab" onclick="switchAuthTab('register')">Register</button>
                </div>

                <!-- LOGIN FORM -->
                <form id="loginForm" class="authForm" onsubmit="handleAuthLogin(event)">
                    <div class="input-group">
                        <label>Email Address</label>
                        <input type="email" id="loginEmail" class="hk-input" placeholder="Enter your email" required>
                    </div>
                    <div class="input-group">
                        <label>Password</label>
                        <input type="password" id="loginPassword" class="hk-input" placeholder="Enter your password" required>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: var(--space-4);">Login</button>
                </form>

                <!-- REGISTER FORM -->
                <form id="registerForm" class="authForm hiddenForm" style="display: none;" onsubmit="handleAuthRegister(event)">
                    <div class="grid grid-cols-2" style="gap: var(--space-4);">
                        <div class="input-group"><input type="text" id="regName" class="hk-input" placeholder="Full Name" required></div>
                        <div class="input-group"><input type="email" id="regEmail" class="hk-input" placeholder="Email" required></div>
                        <div class="input-group"><input type="text" id="regPhone" class="hk-input" placeholder="Phone Number" required></div>
                        <div class="input-group"><input type="password" id="regPassword" class="hk-input" placeholder="Password" required></div>
                        
                        <div class="input-group">
                            <select id="regGender" class="hk-input" required>
                                <option value="">Select Gender</option>
                                <option value="male">Male</option>
                                <option value="female">Female</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                        <div class="input-group"><input type="date" id="regDob" class="hk-input" required></div>
                        <div class="input-group">
                            <select id="regBloodGroup" class="hk-input">
                                <option value="">Blood Group</option>
                                <option>A+</option><option>A-</option><option>B+</option><option>B-</option>
                                <option>AB+</option><option>AB-</option><option>O+</option><option>O-</option>
                            </select>
                        </div>
                        <div class="input-group" style="position: relative;">
                            <label style="position: absolute; top: -8px; left: 10px; background: white; padding: 0 5px; font-size: 11px; color: #64748b; font-weight: 600;">Profile Picture</label>
                            <input type="file" id="regProfilePhoto" class="hk-input" style="padding-top: 12px;" accept="image/*">
                        </div>
                        
                        <div class="input-group" style="grid-column: span 2;"><textarea id="regAddress" class="hk-input" placeholder="Address" rows="2" required></textarea></div>
                        <div class="input-group"><input type="text" id="regCity" class="hk-input" placeholder="City" required></div>
                        <div class="input-group"><input type="text" id="regState" class="hk-input" placeholder="State" required></div>
                        <div class="input-group" style="grid-column: span 2;"><input type="text" id="regPincode" class="hk-input" placeholder="Pincode" required></div>
                        <div class="input-group" style="grid-column: span 2;">
                            <button type="submit" class="btn btn-primary" style="width: 100%;">Register</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="/js/hosp_data.js?v=1790739000"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</body>
</html>
