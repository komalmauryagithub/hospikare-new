<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Dispatch Terminal</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --primary: #0f172a; --accent: #3b82f6; --bg: #f1f5f9; }
        body { font-family: 'Inter', system-ui, sans-serif; margin: 0; padding: 20px; background-color: var(--bg); color: #334155; }
        .card { background: white; border-radius: 16px; padding: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 20px; text-align: center;}
        .card h2 { margin-top: 0; color: var(--primary); font-size: 20px;}
        .alert-icon { width: 64px; height: 64px; background: #fee2e2; color: #ef4444; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; margin: 0 auto 16px auto;}
        .btn { display: block; width: 100%; padding: 16px; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s; margin-bottom: 12px; }
        .btn-primary { background: var(--accent); color: white; }
        .btn-success { background: #16a34a; color: white; }
        .btn-danger { background: #ef4444; color: white; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        #statusLog { font-size: 13px; color: #64748b; margin-top: 20px; padding: 12px; background: #f8fafc; border-radius: 8px; border: 1px solid #e2e8f0; text-align: left; max-height: 150px; overflow-y: auto;}
    </style>
</head>
<body>
    <div class="card" id="startCard">
        <div class="alert-icon"><i class="fa-solid fa-bell fa-shake"></i></div>
        <h2>New Emergency Dispatch</h2>
        <p>You have been assigned to a new trip. Please accept and share your live location.</p>
        <button class="btn btn-primary" id="acceptBtn" onclick="acceptTrip()">Accept & Share Location</button>
    </div>

    <div class="card" id="activeCard" style="display: none;">
        <div class="alert-icon" style="background:#dcfce7; color:#16a34a;"><i class="fa-solid fa-location-dot fa-bounce"></i></div>
        <h2>Trip Active</h2>
        <p>Your location is being shared live with the patient.</p>
        <div id="tripInfo"></div>
        <div id="step1">
            <button class="btn btn-primary" id="mapsPickupBtn" onclick="openMaps('pickup')">📍 Navigate to Patient (Pickup)</button>
            <button class="btn" style="background:#f59e0b; color:white;" id="arrivedBtn" onclick="markArrived()">🔔 I have Arrived at Pickup</button>
        </div>
        <div id="step2" style="display:none; margin-top:20px; border-top:1px solid #e2e8f0; padding-top:20px;">
            <button class="btn btn-success" id="mapsDestBtn" onclick="openMaps('destination')">🏥 Navigate to Hospital (Drop)</button>
            <button class="btn btn-danger" id="completeBtn" onclick="completeTrip()">✅ Complete Trip (Patient Dropped)</button>
        </div>
        <div id="statusLog">System ready...</div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        let watchId = null;

        function log(msg) {
            const div = document.getElementById('statusLog');
            div.innerHTML += `<br>[${new Date().toLocaleTimeString()}] ${msg}`;
            div.scrollTop = div.scrollHeight;
        }

        async function acceptTrip() {
            if(!token) return alert("Invalid token");
            try {
                await fetch(`/api/tracking/${token}/accept`, {method: 'POST'});
                document.getElementById('startCard').style.display = 'none';
                document.getElementById('activeCard').style.display = 'block';
                startTracking();
            } catch(e) {
                alert("Failed to accept trip");
            }
        }

        function startTracking() {
            if (!navigator.geolocation) {
                log("Geolocation is not supported by your browser.");
                return;
            }
            log("Requesting location access...");
            watchId = navigator.geolocation.watchPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    log(`Location updated: ${lat.toFixed(4)}, ${lng.toFixed(4)}`);
                    sendLocation(lat, lng);
                },
                (error) => {
                    log("Error getting location: " + error.message);
                },
                { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
            );
        }

        async function sendLocation(lat, lng) {
            try {
                await fetch(`/api/tracking/${token}/location`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({lat, lng})
                });
            } catch(e) {
                log("Failed to sync location to server");
            }
        }

        async function markArrived() {
            if(!token) return;
            try {
                const res = await fetch(`/api/tracking/${token}/status`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({status: 'arrived'})
                });
                const data = await res.json();
                if(data.success) {
                    log("Marked as arrived at pickup.");
                    document.getElementById('step1').style.display = 'none';
                    document.getElementById('step2').style.display = 'block';
                }
            } catch(e) {
                log("Failed to update status");
            }
        }

        async function completeTrip() {
            if(confirm("Are you sure you want to end this trip?")) {
                if(watchId) navigator.geolocation.clearWatch(watchId);
                try {
                    await fetch(`/api/tracking/${token}/complete`, {method: 'POST'});
                    document.getElementById('activeCard').innerHTML = '<h2>Trip Completed</h2><p>Thank you. You are now available for new dispatches.</p>';
                } catch(e) {
                    alert("Failed to complete trip");
                }
            }
        }

        let tripPickup = "";
        let tripDestination = "";

        async function fetchBookingDetails() {
            if(!token) return;
            try {
                const res = await fetch(`/api/tracking/${token}/location`);
                const data = await res.json();
                if (data && data.booking) {
                    tripPickup = data.booking.pickup_address;
                    tripDestination = data.booking.destination_address;
                    
                    const infoDiv = document.getElementById('tripInfo');
                    if (infoDiv) {
                        infoDiv.innerHTML = `
                            <div style="text-align:left; background:#f8fafc; padding:12px; border-radius:8px; margin-bottom:15px; font-size:14px; border:1px solid #e2e8f0;">
                                <strong>📍 Pickup:</strong> ${tripPickup}<br><br>
                                <strong>🏥 Drop-off:</strong> ${tripDestination}
                            </div>
                        `;
                    }
                }
            } catch(e) {
                console.error(e);
            }
        }
        
        // Fetch on load
        fetchBookingDetails();

        function openMaps(type) {
            let address = "";
            if (type === 'pickup' && tripPickup) {
                address = tripPickup;
            } else if (type === 'destination' && tripDestination) {
                address = tripDestination;
            } else {
                address = "hospital";
            }
            
            // Modern Google Maps Directions URL forces a navigation route map from current GPS location
            const mapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(address)}&travelmode=driving`;
            window.open(mapsUrl, '_blank');
        }
    </script>
</body>
</html>
